name: Agentic env smoke test

on:
  push:
    paths:
      - 'agentic-env/**'
      - 'omp/hooks/**'
      - '.github/workflows/agentic-env-smoke-test.yml'
  pull_request:
    paths:
      - 'agentic-env/**'
      - 'omp/hooks/**'
      - '.github/workflows/agentic-env-smoke-test.yml'
  workflow_dispatch:

jobs:
  agentic-smoke-test:
    name: Debian bookworm x86_64 clean install
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: agentic-env
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify docker compose available
        run: docker compose version

      - name: Run fresh-install smoke test
        run: docker compose up --build --force-recreate --exit-code-from fresh-install fresh-install

  agentic-smoke-test-macos:
    name: Native macOS 15 Apple Silicon arm64 clean install
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: agentic-env
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require native Apple Silicon
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
          xcode-select -p

      - name: Prepare Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Node.js 20 and npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare uv without a restored cache
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Prepare archive utilities and CA certificates
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xz ca-certificates

      - name: Run native clean-install smoke test
        run: |
          export AGENTIC_PREREQ_PATH="$(dirname "$(command -v uv)"):$(dirname "$(command -v python3)"):$(dirname "$(command -v node)"):$(brew --prefix xz)/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          export AGENTIC_SMOKE_HOME="$RUNNER_TEMP/agentic-env-acceptance"
          sh ./clean-acceptance.sh

  agentic-smoke-test-arch:
    name: Arch Linux x86_64 clean install (not CachyOS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: agentic-env
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify docker compose available
        run: docker compose version

      - name: Run Arch clean-install smoke test
        run: docker compose --profile arch up --build --force-recreate --exit-code-from fresh-install-arch fresh-install-arch
